  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0505; color: #f3dcc0; font-family: "Abyss Loader KR", "Noto Sans SC", sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #game-safe-area { position: fixed; inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); visibility: hidden; pointer-events: none; }
    #loading { position: fixed; inset: 0; box-sizing: border-box; display: grid; place-content: center; gap: 14px; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: radial-gradient(ellipse at 50% 60%, #2a0d07 0%, #0a0505 62%); text-align: center; overflow: auto; }
    #loading[hidden], [hidden] { display: none !important; }
    #loading > * { justify-self: center; max-width: min(560px, 100%); }
    #loading h1 { margin: 0; font-weight: 700; font-size: clamp(24px, 4.4vw, 44px); line-height: 1.15; color: #ffc46b; letter-spacing: 0.02em; text-shadow: 0 0 18px #ff5a1f66, 0 2px 0 #3a0e05; overflow-wrap: anywhere; }
    #loading-sub { margin: -6px 0 6px; font-size: 14px; letter-spacing: 0.4em; color: #c98a62; }
    #loading-icon { width: 96px; height: 96px; image-rendering: pixelated; filter: drop-shadow(0 0 16px #ff6a2a88); animation: ember 2.4s ease-in-out infinite; }
    #loading p { margin: 0; }
    #loading-status { font-weight: 500; font-size: 15px; color: #f3dcc0; min-height: 1.4em; }
    #loading progress { display: block; width: min(340px, 75vw); height: 8px; border: 1px solid #6b2a14; border-radius: 6px; overflow: hidden; accent-color: #ff7a2e; background: #1c0b07; }
    #loading progress::-webkit-progress-bar { background: #1c0b07; border-radius: 6px; }
