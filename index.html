<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>심연의 마도사 · 무한 던전</title>
  <link rel="icon" href="./index.icon.png">
  <link rel="apple-touch-icon" href="./index.apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0505; }
    main {
      --vw: 100vw;
      --vh: 100vh;
      --w: calc(var(--vw) - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      --h: calc(var(--vh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      width: var(--w);
      height: var(--h);
      overflow: hidden;
    }
    @supports (height: 100dvh) { main { --vw: 100dvw; --vh: 100dvh; } }
    iframe { display: block; position: absolute; inset: 0 auto auto 0; width: 100%; height: 100%; border: 0; }
    @media (orientation: portrait) {
      iframe {
        left: 100%;
        width: var(--h);
        height: var(--w);
        transform-origin: top left;
        transform: rotate(90deg);
      }
    }
  </style>
</head>
<body>
  <main>
    <iframe id="game" title="심연의 마도사" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
    <noscript>게임을 실행하려면 JavaScript를 켜 주세요.</noscript>
  </main>
  <script>
    // The browser maps touch and mouse coordinates into the rotated frame.
    // Its document stays loaded as the phone turns.
    const gameUrl = new URL('./game.html', location.href);
    gameUrl.search = location.search;
    document.getElementById('game').src = gameUrl.href;
  </script>
</body>
</html>
